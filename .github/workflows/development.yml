name: Development builds

on:
  workflow_dispatch:
  push:
    branches: ['codex/bazzite-development', 'codex/linux-release']
  pull_request:

permissions:
  contents: read

jobs:
  linux-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run portable framework and QC timeline tests
        run: python3 scripts/test-linux.py
      - name: Check Linux tools
        run: python3 -m unittest discover -s scripts/tests -v

  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Run framework tests
        shell: pwsh
        run: ./DLL/Framework/Tests/BuildAndRun.ps1
      - name: Run current QC production regression checks
        shell: pwsh
        run: ./tests/run-qc-regression.ps1
      - name: Check GUI and runtime override fixture parity
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'qc-gui-check'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item GUI/Lib/Newtonsoft.Json.dll $out
          $compiler = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -find 'MSBuild\**\Bin\Roslyn\csc.exe' | Select-Object -First 1
          if (-not $compiler) { throw 'Visual Studio C# compiler not found' }
          & $compiler /nologo /target:exe "/out:$out\QCOverridesRegression.exe" /r:GUI\Lib\Newtonsoft.Json.dll .\GUI\QCOverrides.cs .\tests\QCOverridesRegression.cs
          if ($LASTEXITCODE -ne 0) { throw 'GUI fixture build failed' }
          & "$out/QCOverridesRegression.exe" tests/qc-overrides-fixtures.json
          if ($LASTEXITCODE -ne 0) { throw 'GUI fixture checks failed' }
      - name: Build development package
        shell: pwsh
        run: ./build-rsmods-deliverable.ps1 -VersionTag "linux-dev-${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: rsmods-qc-development
          path: |
            dist/*-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
